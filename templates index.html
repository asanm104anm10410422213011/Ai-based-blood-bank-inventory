<!DOCTYPE html>
<html>
<head>
    <title>Blood Bank Inventory</title>
</head>
<body>

    <h1>AI-Based Blood Bank Inventory System</h1>

    <h2>Add Blood Stock</h2>

    <form method="POST">

        <label>Blood Group:</label>

        <select name="blood_group">
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>O+</option>
            <option>O-</option>
            <option>AB+</option>
            <option>AB-</option>
        </select>

        <br><br>

        <label>Units:</label>
        <input type="number" name="units" min="1" required>

        <br><br>

        <button type="submit">Add Stock</button>

    </form>

    <h2>Current Blood Stock</h2>

    {% for group, units in blood_stock.items() %}
        <p>{{ group }} : {{ units }} units</p>
    {% endfor %}

</body>
</html>
